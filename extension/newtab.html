<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新标签</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/newtab.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.8A2.8 2.8 0 0 1 7.8 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"/><path d="M5 5v16.5M9 7h7"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8zM7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app-shell">
    <header class="topbar">
      <section class="group-strip" aria-label="分组">
        <div class="group-tabs" id="group-tabs"></div>
        <button class="add-group" id="add-group" title="新建分组" aria-label="新建分组"><svg><use href="#i-plus"/></svg></button>
      </section>

      <label class="search-box">
        <svg><use href="#i-search"/></svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索">
      </label>

      <div class="top-actions">
        <button class="icon-button" id="open-stats" title="统计" aria-label="统计"><svg><use href="#i-chart"/></svg></button>
        <button class="icon-button" id="open-settings" title="设置" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
        <button class="icon-button add-dial-button" id="add-dial" title="添加网站" aria-label="添加网站"><svg><use href="#i-plus"/></svg></button>
      </div>
    </header>

    <main class="workspace">

      <section class="dial-stage" aria-live="polite">
        <div class="stage-heading">
          <div>
            <p class="eyebrow" id="stage-eyebrow">快速拨号</p>
            <h1 id="stage-title">首页</h1>
          </div>
          <div class="stage-tools"><p class="stage-count" id="stage-count"></p><button class="ghost-button open-group-button" id="open-group"><span>打开全部</span><svg><use href="#i-arrow"/></svg></button></div>
        </div>
        <div class="dial-grid" id="dial-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-orbit"><i></i></span>
          <button class="first-dial-button" id="empty-add">点击这里添加第一个网站</button>
          <button class="text-button" id="empty-top-sites">从常用网站中选择</button>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <button id="footer-sort" class="text-button">手动排序</button>
    </footer>
  </div>

  <div id="sidebar-toggle" hidden></div>
  <div class="sidebar-arrow" hidden></div>
  <aside id="sidebars" aria-label="侧栏">
    <section class="sidebar-panel" id="bookmarks-sidebar" hidden>
      <h1>书签</h1>
      <input class="sidebar-search" type="search" id="bookmarks-search" placeholder="搜索书签">
      <ul id="bookmarks-list"></ul>
    </section>
    <section class="sidebar-panel" id="history-sidebar" hidden>
      <h1>最近关闭的标签页</h1>
      <input class="sidebar-search" type="search" id="history-search" placeholder="搜索历史记录">
      <ul id="history-items"></ul>
    </section>
  </aside>

  <dialog id="dial-dialog">
    <form id="dial-form">
      <div class="dialog-head"><h2 id="dial-dialog-title">添加网站</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
      <div class="dialog-body">
        <input type="hidden" name="id">
        <label class="field"><span>名称</span><input name="title" required maxlength="120" placeholder="网站名称"></label>
        <label class="field"><span>网址</span><input name="url" required inputmode="url" placeholder="example.com"></label>
        <label class="field"><span>分组</span><select name="groupId" required></select></label>
        <fieldset class="thumbnail-choices">
          <legend>缩略图</legend>
          <label><input type="radio" name="thumbnailType" value="default"><span>网站图标<small>使用网站图标</small></span></label>
          <label><input type="radio" name="thumbnailType" value="screenshot" checked><span>网页截图<small>自动打开网页，截图完成后关闭</small></span></label>
          <label><input type="radio" name="thumbnailType" value="upload"><span>上传图片<small>选择一张图片</small></span></label>
          <label><input type="radio" name="thumbnailType" value="url"><span>图片网址<small>无法加载时显示默认图标</small></span></label>
        </fieldset>
        <label class="field thumbnail-extra" data-thumbnail-field="upload" hidden><span>选择图片</span><input name="imageFile" type="file" accept="image/*"><small>最大 8 MB。</small></label>
        <label class="field thumbnail-extra" data-thumbnail-field="url" hidden><span>图片网址</span><input name="imageUrl" inputmode="url" placeholder="https://…"></label>
      </div>
      <div class="dialog-foot"><button type="button" class="danger-button" id="delete-dial" hidden><svg><use href="#i-trash"/></svg>删除</button><span class="dialog-spacer"></span><button type="button" class="ghost-button" data-close-dialog>取消</button><button class="primary-button" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="top-sites-dialog" class="wide-dialog">
    <form id="top-sites-form">
      <div class="dialog-head"><h2>常用网站</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
      <div class="dialog-body"><div class="top-sites-grid" id="top-sites-list"></div></div>
      <div class="dialog-foot"><button type="button" class="ghost-button" data-close-dialog>取消</button><button class="primary-button" type="submit">添加所选网站</button></div>
    </form>
  </dialog>

  <dialog id="group-dialog">
    <form id="group-form">
      <div class="dialog-head"><h2 id="group-dialog-title">新建分组</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
      <div class="dialog-body">
        <input type="hidden" name="id">
        <label class="field"><span>名称</span><input name="name" required maxlength="48" placeholder="工作"></label>
      </div>
      <div class="dialog-foot"><button type="button" class="danger-button" id="delete-group" hidden>删除分组</button><span class="dialog-spacer"></span><button type="button" class="ghost-button" data-close-dialog>取消</button><button class="primary-button" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="stats-dialog" class="wide-dialog">
    <div class="dialog-head"><div><h2>访问统计</h2></div><button class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="dialog-body" id="stats-content"></div>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog">
    <form id="settings-form">
      <div class="dialog-head"><h2>设置</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
      <div class="settings-dialog-layout">
        <nav class="settings-navigation" aria-label="设置分类">
          <button class="active" type="button" data-settings-tab="general">常规</button>
          <button type="button" data-settings-tab="appearance">拨号样式</button>
          <button type="button" data-settings-tab="thumbnail">缩略图</button>
          <button type="button" data-settings-tab="background">背景</button>
          <button type="button" data-settings-tab="sidebar">侧栏</button>
          <button type="button" data-settings-tab="data">数据</button>
        </nav>
        <div class="settings-panels">
          <section data-settings-panel="general">
            <h3>常规</h3>
            <div class="settings-fields">
              <label><span>列数</span><span class="range-control"><input type="range" min="2" max="20" step="1" data-setting-range="columns"><input name="columns" type="number" min="2" max="20" required></span></label>
              <label><span>拨号间距</span><span class="range-control"><input type="range" min="0" max="100" step="1" data-setting-range="gap"><input name="gap" type="number" min="0" max="100" required></span></label>
              <label><span>页面宽度（%）</span><span class="range-control"><input type="range" min="10" max="100" step="1" data-setting-range="dialSpace"><input name="dialSpace" type="number" min="10" max="100" required></span></label>
              <div class="settings-choice-row"><span class="settings-choice-label">排列方式</span><div class="segmented-control"><label><input name="sortMode" type="radio" value="manual"><span>手动排列</span></label><label><input name="sortMode" type="radio" value="visits"><span>访问次数</span></label><label><input name="sortMode" type="radio" value="title"><span>名称</span></label></div></div>
            </div>
            <div class="settings-switches">
              <label><input name="verticalCenter" type="checkbox"><span>垂直居中</span></label>
              <label><input name="darkTheme" type="checkbox"><span>深色主题</span></label>
              <label><input name="showAddButton" type="checkbox"><span>显示添加按钮</span></label>
              <label><input name="showSearch" type="checkbox"><span>显示搜索框</span></label>
              <label><input name="showTitles" type="checkbox"><span>显示网站名称</span></label>
              <label><input name="showVisits" type="checkbox"><span>显示访问次数</span></label>
              <label><input name="keepActiveGroup" type="checkbox"><span>记住当前分组</span></label>
              <label><input name="highlight" type="checkbox"><span>突出显示当前时段常用网站</span></label>
              <label><input name="alwaysNewTab" type="checkbox"><span>始终在新标签页中打开</span></label>
              <label><input name="scrollLayout" type="checkbox"><span>使用滚动布局</span></label>
              <label><input name="showContextMenu" type="checkbox"><span>启用右键菜单</span></label>
            </div>
          </section>

          <section data-settings-panel="appearance" hidden>
            <h3>拨号样式</h3>
            <div class="settings-fields">
              <label><span>圆角</span><span class="range-control"><input type="range" min="0" max="30" step="1" data-setting-range="cardRadius"><input name="cardRadius" type="number" min="0" max="30" required></span></label>
              <label><span>内边距</span><span class="range-control"><input type="range" min="0" max="30" step="1" data-setting-range="padding"><input name="padding" type="number" min="0" max="30" required></span></label>
              <label><span>缩略图比例</span><span class="range-control"><input type="range" min="0.5" max="2" step="0.05" data-setting-range="thumbnailRatio"><input name="thumbnailRatio" type="number" min="0.5" max="2" step="0.05" required></span></label>
              <div class="settings-choice-row"><span class="settings-choice-label">阴影</span><div class="segmented-control"><label><input name="shadowStyle" type="radio" value="none"><span>无</span></label><label><input name="shadowStyle" type="radio" value="box"><span>方框</span></label><label><input name="shadowStyle" type="radio" value="drop"><span>投影</span></label><label><input name="shadowStyle" type="radio" value="glow"><span>发光</span></label></div></div>
              <div class="settings-choice-row"><span class="settings-choice-label">标题对齐</span><div class="segmented-control"><label><input name="titleAlign" type="radio" value="left"><span>左对齐</span></label><label><input name="titleAlign" type="radio" value="center"><span>居中</span></label><label><input name="titleAlign" type="radio" value="right"><span>右对齐</span></label></div></div>
              <label><span>字体</span><span class="settings-font-field"><input name="fontFamily" list="settings-font-list" placeholder="输入字体名称"><button type="button" class="ghost-button" id="settings-load-fonts">读取系统字体</button></span></label>
              <datalist id="settings-font-list"><option value="Helvetica, Arial, sans-serif"></option><option value="Arial, sans-serif"></option><option value="Microsoft YaHei, sans-serif"></option><option value="PingFang SC, sans-serif"></option><option value="Noto Sans CJK SC, sans-serif"></option><option value="Georgia, serif"></option><option value="monospace"></option></datalist>
              <label><span>字号</span><span class="range-control"><input type="range" min="8" max="30" step="1" data-setting-range="fontSize"><input name="fontSize" type="number" min="8" max="30" required></span></label>
              <div class="settings-choice-row"><span class="settings-choice-label">字体样式</span><div class="segmented-control"><label><input name="fontStyle" type="radio" value="normal"><span>正常</span></label><label><input name="fontStyle" type="radio" value="italic"><span>斜体</span></label></div></div>
              <div class="settings-choice-row"><span class="settings-choice-label">字体粗细</span><div class="segmented-control"><label><input name="fontWeight" type="radio" value="normal"><span>正常</span></label><label><input name="fontWeight" type="radio" value="bold"><span>粗体</span></label></div></div>
            </div>
            <div class="settings-colors">
              <label><span>拨号背景</span><input name="dialBackground" type="color"></label>
              <label><span>悬停背景</span><input name="dialBackgroundHover" type="color"></label>
              <label><span>边框</span><input name="dialBorder" type="color"></label>
              <label><span>悬停边框</span><input name="dialBorderHover" type="color"></label>
              <label><span>标题</span><input name="titleColor" type="color"></label>
              <label><span>悬停标题</span><input name="titleColorHover" type="color"></label>
            </div>
            <label class="settings-textarea"><span>自定义 CSS</span><textarea name="customCss" rows="7"></textarea></label>
          </section>

          <section data-settings-panel="thumbnail" hidden>
            <h3>缩略图</h3>
            <div class="settings-fields">
              <div class="settings-choice-row"><span class="settings-choice-label">自动更新</span><div class="segmented-control"><label><input name="refreshThumbnails" type="radio" value="0"><span>从不</span></label><label><input name="refreshThumbnails" type="radio" value="2"><span>每 2 次</span></label><label><input name="refreshThumbnails" type="radio" value="5"><span>每 5 次</span></label><label><input name="refreshThumbnails" type="radio" value="10"><span>每 10 次</span></label></div></div>
              <div class="settings-choice-row"><span class="settings-choice-label">截图质量</span><div class="segmented-control"><label><input name="thumbnailQuality" type="radio" value="low"><span>低</span></label><label><input name="thumbnailQuality" type="radio" value="medium"><span>中</span></label><label><input name="thumbnailQuality" type="radio" value="high"><span>高</span></label></div></div>
              <div class="settings-choice-row"><span class="settings-choice-label">图片适配</span><div class="segmented-control"><label><input name="thumbnailFit" type="radio" value="contain"><span>完整显示并居中</span></label><label><input name="thumbnailFit" type="radio" value="cover"><span>填满缩略图</span></label></div></div>
            </div>
          </section>

          <section data-settings-panel="background" hidden>
            <h3>背景</h3>
            <div class="settings-fields">
              <label><span>背景颜色</span><input name="backgroundColor" type="color"></label>
              <label><span>图片网址</span><input name="backgroundUrl" type="url" placeholder="https://…"></label>
              <div class="settings-choice-row"><span class="settings-choice-label">重复方式</span><div class="segmented-control"><label><input name="backgroundRepeat" type="radio" value="no-repeat"><span>不重复</span></label><label><input name="backgroundRepeat" type="radio" value="repeat"><span>重复</span></label><label><input name="backgroundRepeat" type="radio" value="repeat-x"><span>横向</span></label><label><input name="backgroundRepeat" type="radio" value="repeat-y"><span>纵向</span></label></div></div>
              <div class="settings-choice-row"><span class="settings-choice-label">图片尺寸</span><div class="segmented-control"><label><input name="backgroundSize" type="radio" value="auto"><span>原始尺寸</span></label><label><input name="backgroundSize" type="radio" value="cover"><span>覆盖页面</span></label><label><input name="backgroundSize" type="radio" value="contain"><span>完整显示</span></label></div></div>
              <label><span>图片位置</span><select name="backgroundPosition"><option value="left top">左上</option><option value="center top">中上</option><option value="right top">右上</option><option value="left center">左中</option><option value="center center">居中</option><option value="right center">右中</option><option value="left bottom">左下</option><option value="center bottom">中下</option><option value="right bottom">右下</option></select></label>
              <label><span>从电脑选择</span><input id="settings-background-file" type="file" accept="image/*"></label>
            </div>
            <button type="button" class="ghost-button compact" id="settings-clear-background">移除背景图片</button>
          </section>

          <section data-settings-panel="sidebar" hidden>
            <h3>侧栏</h3>
            <div class="settings-switches">
              <label><input name="sidebarEnabled" type="checkbox"><span>启用侧栏</span></label>
              <label><input name="sidebarBookmarks" type="checkbox"><span>显示书签</span></label>
              <label><input name="sidebarHistory" type="checkbox"><span>显示最近关闭和历史记录</span></label>
            </div>
          </section>

          <section data-settings-panel="data" hidden>
            <h3>数据</h3>
            <div class="settings-data-actions">
              <button type="button" class="ghost-button" id="settings-export-backup">导出备份</button>
              <label class="ghost-button settings-file-button">导入备份<input id="settings-import-backup" type="file" accept="application/json"></label>
              <button type="button" class="ghost-button" id="settings-export-bookmarks">导出到 Chrome 书签</button>
              <button type="button" class="danger-button" id="settings-clear-data">清空全部数据</button>
            </div>
          </section>
        </div>
      </div>
      <div class="dialog-foot settings-dialog-foot"><button type="button" class="ghost-button" id="settings-reset">恢复默认设置</button><p id="settings-status" role="status"></p><span class="dialog-spacer"></span><button type="button" class="ghost-button" data-close-dialog>取消</button><button class="primary-button" type="submit">保存设置</button></div>
    </form>
  </dialog>

  <div class="context-menu" id="page-context-menu" hidden>
    <button data-command="add-dial">添加网站</button>
    <button data-command="add-group">新建分组</button>
    <hr>
    <button data-command="settings">设置</button>
    <button data-command="statistics">统计</button>
  </div>
  <div class="context-menu" id="dial-context-menu" hidden>
    <button data-command="open-new-tab">在新标签页中打开</button>
    <hr>
    <button data-command="edit-dial">编辑</button>
    <button data-command="delete-dial">删除</button>
    <button data-command="refresh-thumbnail">重新生成缩略图</button>
  </div>
  <div class="context-menu" id="group-context-menu" hidden>
    <button data-command="home-note" disabled>这是主分组</button>
    <button data-command="open-group">打开全部网站</button>
    <hr>
    <button data-command="edit-group">编辑分组</button>
    <button data-command="delete-group">删除分组</button>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/newtab.js"></script>
</body>
</html>
